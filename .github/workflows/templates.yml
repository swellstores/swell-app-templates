name: Templates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [react, vinext, react-storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.template == 'react-storefront'
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify -- ${{ matrix.template }}
